name: CRM checks
on:
  push:
    branches: [main, feature/crm]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
