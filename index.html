items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}.filters{display:flex;gap:12px;align-items:end}.filters .control{min-width:170px}.pagehead{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:22px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px}.kpi .value{font-size:32px;font-weight:750;letter-spacing:-1px;margin:10px 0 2px}.kpi .label{font-size:14px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.badge{display:inline-flex;align-items:center;border-radius:5px;padding:3px 8px;font-size:13px;font-weight:650;background:var(--light);color:var(--green)}.amber{background:#fff2d6;color:#94610b}.gray{background:#edf0ef;color:#62746c}.notice{background:#fff4db;border:1px solid #ebd8a5;border-radius:8px;padding:13px 16px;margin:14px 0;font-size:14px}.tablewrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap;font-size:14px}th{font-weight:600;color:var(--muted);background:#f9fbfa;font-size:13px}th,td{padding:14px 16px;border-bottom:1px solid var(--line)}tbody tr:last-child td{border-bottom:0}.num{text-align:right;font-variant-numeric:tabular-nums}.total{font-weight:750}.empty{padding:36px;text-align:center;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.error{background:#fff0ed;color:#a6251b;padding:12px;border-radius:8px;margin:14px 0}.success{background:var(--light);color:var(--green);padding:12px;border-radius:8px;margin:14px 0}dialog{border:1px solid var(--line);border-radius:14px;max-width:680px;width:calc(100% - 30px);padding:28px;color:var(--dark)}dialog::backdrop{background:#08271980}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:#eef3ef;color:var(--dark);padding:5px 12px}.check{display:flex;align-items:center;gap:10px}.check input{width:auto}.login button[type=submit]{width:100%}.statusline{margin-bottom:16px}.footer{font-size:13px;color:var(--muted);margin-top:24px}#toast{position:fixed;bottom:20px;right:20px;max-width:430px;z-index:100;padding:14px 20px;border-radius:10px;background:var(--dark);color:white;display:none}.split{display:grid;gap:18px}.uploadbox{border:1px dashed #aac4b5;border-radius:10px;padding:22px;background:#fafcfb}code{font-size:14px;background:#edf3ef;padding:2px 5px;border-radius:4px}.loading{padding:50px;text-align:center}.pill{background:#edf3ef;padding:8px 12px;border-radius:8px;font-size:14px}.highlight{background:var(--dark);color:white}.highlight .muted{color:#c0d8ca}@media(max-width:1100px){main{padding:24px}.shell{grid-template-columns:190px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.topbar{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}.sidebar{padding:16px;gap:12px}.sidebar .brand{font-size:25px}.nav{display:flex;overflow:auto;gap:6px}.nav button{white-space:nowrap;font-size:14px;padding:9px}.sidebottom{display:flex;align-items:center;justify-content:space-between}.sidebottom button{width:auto;margin:0}.sidebar .tag{display:none}main{padding:18px}.filters{width:100%;flex-wrap:wrap}.filters .control{flex:1;min-width:135px}.kpis{gap:10px}.card{padding:17px}.kpi .value{font-size:27px}.pagehead{flex-direction:column}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}h1{font-size:25px}.login{margin:25px 16px;padding:25px}.topbar{margin-bottom:20px}}

<script>
'use strict';
const CONFIG={url:'https://eqtyfnluswalfassmlxd.supabase.co',key:'sb_publishable_QFxWloxs6waJCTvV1jtuPQ_MI7K4foM'};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null?'Da completare':Number(v).toLocaleString('it-IT',{style:'currency',currency:'EUR'}),num=v=>v==null?'—':Number(v).toLocaleString('it-IT',{maximumFractionDigits:4});
const date=v=>v?String(v).slice(0,10).split('-').reverse().join('/'):'—',monthName=v=>new Date(v+'-02T12:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
let session=null;try{session=JSON.parse(sessionStorage.getItem('nexus_portal_session')||'null')}catch{}
let state={admin:false,clients:[],months:[],shipments:[],charges:[],returns:[],client:'all',month:'2026-09',view:'overview',email:''};
const TABS=[['overview','Riepilogo'],['shipments','Spedizioni'],['storage','Spazio occupato'],['carriers','Corrieri'],['returns','Resi'],['manage','Clienti e accessi'],['imports','Importazioni']];
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',5000)}
function saveSession(s){session=s;s?sessionStorage.setItem('nexus_portal_session',JSON.stringify(s)):sessionStorage.removeItem('nexus_portal_session')}
async function auth(path,body){const r=await fetch(CONFIG.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:CONFIG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Accesso non riuscito');if(d.access_token&&d.expires_in&&!d.expires_at)d.expires_at=Math.floor(Date.now()/1000)+d.expires_in;return d}
let refreshPromise=null;
async function token(){if(!session)throw Error('Accedi al portale');if(session.expires_at*1000<Date.now()+60000){if(!refreshPromise)refreshPromise=auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token}).then(saveSession).catch(e=>{saveSession(null);login('Sessione scaduta. Accedi nuovamente.');throw e}).finally(()=>refreshPromise=null);await refreshPromise}return session.access_token}
async function api(table,{method='GET',query='',body,prefer='return=representation'}={}){const tok=await token();const r=await fetch(CONFIG.url+'/rest/v1/'+table+(query?'?'+query:''),{method,headers:{apikey:CONFIG.key,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:prefer},body:body===undefined?undefined:JSON.stringify(body)});let d=null;const txt=await r.text();try{d=txt?JSON.parse(txt):null}catch{throw Error('Risposta del server non valida')}if(!r.ok)throw Error(d?.message||'Impossibile completare la richiesta');return d}
async function all(table){let rows=[],offset=0;while(true){const chunk=await api(table,{query:'select=*&order='+ (table==='portal_admins'?'user_id':'id')+'&limit=1000&offset='+offset});rows.push(...chunk);if(chunk.length<1000)break;offset+=1000}return rows}
function login(error=''){ $('#app').innerHTML='<div class="login"><div class="brand">NEX<span>US</span></div><p class="tag">Portale clienti</p><h1 style="margin-top:28px">I tuoi dati, ogni mese.</h1><p class="muted">Spedizioni, logistica, spazio occupato e resi.</p><form id="loginform"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginerror">'+(error?'<div class="error">'+esc(error)+'</div>':'')+'</div><button type="submit">Accedi</button></form><p class="footer">L’accesso viene abilitato da Nexus per la tua azienda.</p></div>';$('#loginform').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const s=await auth('token?grant_type=password',{email:$('#email').value.trim(),password:$('#password').value});s.expires_at=Math.floor(Date.now()/1000)+s.expires_in;saveSession(s);await load()}catch(err){$('#loginerror').innerHTML='<div class="error">'+esc(err.message)+'</div>';b.disabled=false}}}
async function load(){try{const a=await all('portal_admins');state.admin=a.length>0;state.email=session.user?.email||'';[state.clients,state.months,state.shipments,state.returns]=await Promise.all(['portal_clients','portal_months','portal_shipments','portal_returns'].map(all));state.charges=state.admin?await all('portal_carrier_charges'):[];if(!state.admin&&state.clients.length)state.client=state.clients[0].id;if(!state.clients.length&&!state.admin){$('#app').innerHTML='<div class="login"><div class="brand">NEXUS</div><h1>Accesso da abilitare</h1><p>Il tuo account non è ancora collegato a un cliente. Contatta Nexus.</p><button onclick="logout()">Esci</button></div>';return}shell()}catch(e){if(session){$('#app').innerHTML='<div class="login"><h1>Dati non disponibili</h1><div class="error">'+esc(e.message)+'</div><button onclick="load()">Riprova</button> <button class="secondary" onclick="logout()">Esci</button></div>'}}}
async function logout(){if(session)try{await fetch(CONFIG.url+'/auth/v1/logout',{method:'POST',headers:{apikey:CONFIG.key,Authorization:'Bearer '+session.access_token}})}catch{}saveSession(null);state.client='all';state.view='overview';login()}
function clientName(id){return state.clients.find(c=>c.id===id)?.name||'Da attribuire'}
function selected(r){return state.client==='all'||r.client_id===state.client}
function inMonth(d){return d?.slice(0,7)===state.month}
function shipments(){return state.shipments.filter(r=>selected(r)&&inMonth(r.shipped_on))}
function returns(){return state.returns.filter(r=>selected(r)&&inMonth(r.received_on))}
function months(){return state.months.filter(r=>selected(r)&&inMonth(r.month))}
function charges(){return state.charges.filter(r=>inMonth(r.month)&&(state.client==='all'||state.shipments.find(s=>s.id===r.shipment_id)?.client_id===state.client))}
function fee(q,r){return q==null||r==null?null:Number(q)*Number(r)}
function sumComplete(items,key){if(!items.length||items.some(r=>r[key]==null))return null;return items.reduce((n,r)=>n+Number(r[key]),0)}
function invoiceLines(){return months().map(m=>{const c=state.clients.find(c=>c.id===m.client_id);return {...m,logistics:fee(m.billable_shipments,m.logistics_rate),storage:fee(m.billable_m3,m.storage_rate),returnfee:fee(m.billable_returns,m.return_rate),name:c?.name}})}
function shell(){ $('#app').innerHTML='<div class="shell"><aside class="sidebar"><div><div class="brand">NEX<span>US</span></div><div class="tag">Portale clienti</div></div><nav class="nav">'+TABS.filter(([v])=>state.admin||!['manage','imports'].includes(v)).map(([v,t])=>'<button data-tab="'+v+'" class="'+(state.view===v?'active':'')+'">'+t+'</button>').join('')+'</nav><div class="sidebottom"><div>'+esc(state.admin?'Amministratore Nexus':'Area cliente')+'<br><span style="color:#b5cabe">'+esc(state.email)+'</span></div><button onclick="logout()">Esci</button></div></aside><main><header class="topbar"><div><div class="tag">Attività e fatturazione</div><strong>'+esc(state.client==='all'?'Tutti i clienti':clientName(state.client))+'</strong></div><div class="filters">'+(state.admin?'<div class="control"><label for="clientfilter">Cliente</label><select id="clientfilter"><option value="all">Tutti i clienti</option>'+state.clients.map(c=>'<option value="'+c.id+'" '+(state.client===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>':'')+'<div class="control"><label for="monthfilter">Mese</label><input id="monthfilter" type="month" value="'+state.month+'" required></div><button class="secondary" onclick="load()">Aggiorna</button></div></header><div id="content"></div><div class="footer">Importi in euro, IVA esclusa. I riepiloghi diventano consultabili dal cliente dopo la conferma di Nexus.</div></main></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.view=b.dataset.tab;shell()});if($('#clientfilter'))$('#clientfilter').onchange=e=>{state.client=e.target.value;shell()};$('#monthfilter').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){state.month=e.target.value;shell()}};render()}
function head(title,desc,actions=''){return '<div class="pagehead"><div><h1>'+title+'</h1><p class="muted">'+desc+'</p></div><div class="actions">'+actions+'</div></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+ (rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+headers.length+'" class="empty">Nessun dato per questo periodo.</td></tr>')+'</tbody></table></div>'}
function badge(m){return m.released?'<span class="badge">Confermato</span>':'<span class="badge amber">Bozza</span>'}
function render(){const view=state.view;let html='';if(view==='overview'){const ms=invoiceLines(),ss=shipments(),cs=charges(),drafts=ms.filter(m=>!m.released).length;html=head('Riepilogo mensile',monthName(state.month),'<button class="secondary" onclick="exportData()">Esporta CSV</button>'+(state.admin?'<button onclick="monthlyForm()">Imposta riepilogo</button>':''));html+='<div class="kpis">'+[['Spedizioni registrate',ss.length,'Da estrazione Deagor'],['Metri cubi fatturabili',num(sumComplete(ms,'billable_m3')),'Quantità confermata nel riepilogo'],['Corrieri al cliente',money(sumComplete(ss,'customer_charge')),'Importi da fatturare'],['Resi registrati',returns().length,'Movimenti di rientro']].map(([l,v,h])=>'<div class="card kpi"><div class="label">'+l+'</div><div class="value">'+v+'</div><div class="muted" style="font-size:14px">'+h+'</div></div>').join('')+'</div>';
if(state.admin&&drafts)html+='<div class="notice">'+drafts+' riepiloghi in bozza. Le quantità estratte vanno controllate prima di confermare la fatturazione.</div>';
html+='<div class="grid"><section class="card"><h2>Voci per la fatturazione</h2>'+table(['Cliente','Logistica','Spazio','Resi','Stato'],ms.map(m=>[esc(m.name),money(m.logistics),money(m.storage),money(m.returnfee),badge(m)]))+'<p class="footer">Logistica: spedizioni × tariffa. Spazio: m³ fatturabili × tariffa mensile. Resi: quantità × tariffa. Corrieri indicati separatamente.</p></section><section class="card highlight"><h2>'+ (state.admin?'Controllo corrieri':'Il tuo riepilogo')+'</h2>'+ (state.admin?'<div class="row"><span>Costo BRT del periodo</span><strong>'+money(cs.reduce((n,r)=>n+Number(r.transport)+Number(r.fuel)+Number(r.extras),0))+'</strong></div><div class="row"><span>Addebiti abbinati</span><strong>'+cs.filter(r=>r.shipment_id).length+' / '+cs.length+'</strong></div><div class="row"><span>Da attribuire</span><strong>'+cs.filter(r=>!r.shipment_id).length+'</strong></div><p class="muted">Il costo del corriere è visibile solo a Nexus.</p><button class="secondary" onclick="state.view=\'carriers\';shell()">Controlla abbinamenti</button>':'<p class="muted">'+(ms.length?'I riepiloghi confermati sono riportati a fianco.':'Nexus non ha ancora confermato il riepilogo del mese.')+'</p>')+'</section></div>';}
if(view==='shipments'){html=head('Spedizioni e logistica','Dettaglio degli ordini spediti nel mese.', '<button class="secondary" onclick="exportData()">Esporta CSV</button>'+(state.admin?'<button onclick="shipmentForm()">Nuova spedizione</button>':''))+table(['Data','Cliente','Spedizione / ordine','Destinatario','CAP / città','Corriere','Addebito cliente',...(state.admin?['']:[])],shipments().sort((a,b)=>b.shipped_on.localeCompare(a.shipped_on)).map(s=>[date(s.shipped_on),esc(clientName(s.client_id)),esc(s.code)+'<br><span class="muted">'+esc(s.order_number||'')+'</span>',esc(s.recipient),esc(s.postcode)+' '+esc(s.city),esc(s.carrier),money(s.customer_charge),...(state.admin?['<button class="secondary small" onclick="shipmentForm(\''+s.id+'\')">Modifica</button>']:[])]));}
if(view==='storage'){html=head('Spazio occupato','Metri cubi fatturabili per cliente e mese.',state.admin?'<button onclick="monthlyForm()">Imposta quantità e tariffa</button>':'')+'<div class="notice">La quantità mensile viene inserita da Nexus secondo il criterio concordato con il cliente. La rilevazione automatica dello spazio sarà aggiunta quando avremo l’estrazione del gestionale.</div>'+table(['Cliente','Mese','m³ fatturabili','Tariffa €/m³/mese','Importo','Stato'],months().map(m=>[esc(clientName(m.client_id)),monthName(state.month),num(m.billable_m3),money(m.storage_rate),money(fee(m.billable_m3,m.storage_rate)),badge(m)]));}
if(view==='carriers'){html=head('Corrieri',state.admin?'Costi BRT, abbinamenti e importi da fatturare al cliente.':'Importi dei trasporti da fatturare.', '<button class="secondary" onclick="exportData()">Esporta CSV</button>'+(state.admin?'<button onclick="chargeForm()">Nuovo addebito</button>':''));if(state.admin){html+='<div class="notice">Gli abbinamenti iniziali sono stati verificati sui due PDF. Per i nuovi addebiti il riferimento BRT viene proposto insieme a destinatario e CAP: l’associazione va confermata.</div>'+table(['Data','Fattura / codice BRT','Rif. mittente','Destinatario','Trasporto','Carburante','Supplementi','Costo totale','Cliente / spedizione',''],charges().map(c=>{const s=state.shipments.find(s=>s.id===c.shipment_id);return [date(c.shipped_on),esc(c.invoice_number)+'<br>'+esc(c.carrier_code),esc(c.reference),esc(c.recipient),num(c.transport)+' €',num(c.fuel)+' €',num(c.extras)+' €',num(Number(c.transport)+Number(c.fuel)+Number(c.extras))+' €',s?esc(clientName(s.client_id))+'<br>'+esc(s.code):'<span class="badge amber">Da attribuire</span>','<button class="secondary small" onclick="matchForm(\''+c.id+'\')">'+(s?'Modifica abbinamento':'Abbina')+'</button>']}));html+='<h2 style="margin-top:30px">Importi al cliente</h2>'}html+=table(['Cliente','Spedizione','Destinatario','Addebito al cliente',...(state.admin?['']:[])],shipments().map(s=>[esc(clientName(s.client_id)),esc(s.code),esc(s.recipient),money(s.customer_charge),...(state.admin?['<button class="secondary small" onclick="shipmentForm(\''+s.id+'\')">Imposta importo</button>']:[])]));}
if(view==='returns'){html=head('Resi','Registro dei rientri e stato della gestione.',state.admin?'<button onclick="returnForm()">Nuovo reso</button>':'')+table(['Data rientro','Cliente','Spedizione','Motivo','Stato',...(state.admin?['']:[])],returns().map(r=>[date(r.received_on),esc(clientName(r.client_id)),esc(r.shipment_code),esc(r.reason),esc(r.status),...(state.admin?['<button class="secondary small" onclick="returnForm(\''+r.id+'\')">Modifica</button>']:[])]));}
if(view==='manage'&&state.admin){html=head('Clienti e accessi','Anagrafiche e tariffe di riferimento. Le tariffe mensili vengono salvate nel riepilogo.', '<button onclick="clientForm()">Nuovo cliente</button><button class="secondary" onclick="accessForm()">Abilita accesso cliente</button>')+table(['Cliente','Logistica €/spedizione','Spazio €/m³/mese','Reso €/rientro',''],state.clients.map(c=>[esc(c.name),money(c.logistics_rate),money(c.storage_rate),money(c.return_rate),'<button class="secondary small" onclick="clientForm(\''+c.id+'\')">Modifica</button>']))+'<section class="card" style="margin-top:22px"><h2>Accesso dei clienti</h2><p>Ogni account è collegato a una sola azienda e può leggere soltanto i suoi dati. I costi di acquisto BRT e i riepiloghi in bozza rimangono riservati a Nexus.</p><p class="muted">Crea o invita l’utente in Supabase Authentication, poi usa il suo ID per collegarlo al cliente. Nessun accesso cliente è stato abilitato automaticamente.</p><div id="accesslist"></div></section>';setTimeout(showAccess,0);}

function options(value){return state.clients.map(c=>'<option value="'+c.id+'" '+(value===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')}
function field(name,label,value='',type='text',attrs=''){return '<div><label for="f_'+name+'">'+label+'</label><input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value??'')+'" '+attrs+'></div>'}

function showForm(title,fields,save){const d=$('#dialog');d.innerHTML='<div class="dialoghead"><h2>'+title+'</h2><button class="close" onclick="document.querySelector(\'#dialog\').close()" aria-label="Chiudi">×</button></div><form id="editform"><div class="formgrid">'+fields+'</div><div id="formerror"></div><div class="actions" style="margin-top:22px"><button type="submit">Salva</button><button type="button" class="secondary" onclick="document.querySelector(\'#dialog\').close()">Annulla</button></div></form>';d.showModal();$('#editform').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await save(Object.fromEntries(new FormData(e.target)));d.close();await load();toast('Dati salvati')}catch(err){$('#formerror').innerHTML='<div class="error">'+esc(err.message)+'</div>';b.disabled=false}}}
function nullable(v){return v===''?null:Number(v)}
async function persist(table,id,body){return api(table,{method:id?'PATCH':'POST',query:id?'id=eq.'+id:'',body})}
function clientForm(id){const c=state.clients.find(c=>c.id===id)||{};showForm(id?'Modifica cliente':'Nuovo cliente',field('name','Ragione sociale',c.name,'text','required')+field('logistics_rate','Logistica €/spedizione',c.logistics_rate,'number','min="0" step="0.0001"')+field('storage_rate','Spazio €/m³/mese',c.storage_rate,'number','min="0" step="0.0001"')+field('return_rate','Reso €/rientro',c.return_rate,'number','min="0" step="0.0001"'),v=>persist('portal_clients',id,{name:v.name.trim(),logistics_rate:nullable(v.logistics_rate),storage_rate:nullable(v.storage_rate),return_rate:nullable(v.return_rate)}))}
function monthlyForm(){if(!state.clients.length){toast('Crea prima un cliente');return}const selectedId=state.client==='all'?state.clients[0].id:state.client;const m=state.months.find(m=>m.client_id===selectedId&&inMonth(m.month))||{},c=state.clients.find(c=>c.id===selectedId);showForm('Riepilogo di '+monthName(state.month),clientField(selectedId)+field('billable_shipments','Spedizioni fatturabili',m.billable_shipments,'number','min="0" step="1"')+field('logistics_rate','Tariffa €/spedizione',m.logistics_rate??c.logistics_rate,'number','min="0" step="0.0001"')+field('billable_m3','Metri cubi fatturabili',m.billable_m3,'number','min="0" step="0.0001"')+field('storage_rate','Tariffa €/m³/mese',m.storage_rate??c.storage_rate,'number','min="0" step="0.0001"')+field('billable_returns','Resi fatturabili',m.billable_returns,'number','min="0" step="1"')+field('return_rate','Tariffa €/reso',m.return_rate??c.return_rate,'number','min="0" step="0.0001"')+'<div class="wide"><label for="f_notes">Note / criterio di calcolo dello spazio</label><textarea id="f_notes" name="notes">'+esc(m.notes)+'</textarea></div><label class="check wide"><input type="checkbox" name="released" '+(m.released?'checked':'')+'>Conferma e rendi visibile al cliente</label>',async v=>{let body={client_id:v.client_id,month:state.month+'-01',notes:v.notes,released:v.released==='on'};for(const k of ['billable_shipments','logistics_rate','billable_m3','storage_rate','billable_returns','return_rate'])body[k]=nullable(v[k]);if(body.released&&Object.entries(body).some(([k,val])=>['billable_shipments','logistics_rate','billable_m3','storage_rate','billable_returns','return_rate'].includes(k)&&val==null))throw Error('Completa quantità e tariffe prima di confermare. Per voci non applicabili inserisci 0.');await api('portal_months',{method:'POST',query:'on_conflict=client_id,month',prefer:'resolution=merge-duplicates,return=representation',body})});$('#f_client_id').onchange=e=>{state.client=e.target.value;$('#dialog').close();monthlyForm()}}
function shipmentForm(id){if(!state.clients.length){toast('Crea prima un cliente');return}const s=state.shipments.find(s=>s.id===id)||{};showForm(id?'Modifica spedizione':'Nuova spedizione',clientField(s.client_id)+field('code','Numero spedizione Deagor',s.code,'text','required')+field('order_number','Numero ordine',s.order_number)+field('reference','Riferimento mittente BRT',s.reference)+field('shipped_on','Data spedizione',s.shipped_on||state.month+'-01','date','required')+field('recipient','Destinatario',s.recipient,'text','required')+field('postcode','CAP',s.postcode)+field('city','Città',s.city)+field('carrier','Corriere',s.carrier||'BRT','text','required')+field('customer_charge','Importo corriere al cliente (€)',s.customer_charge,'number','min="0" step="0.0001"'),v=>persist('portal_shipments',id,{...v,customer_charge:nullable(v.customer_charge)}))}
function chargeForm(){showForm('Nuovo addebito corriere',field('invoice_number','Numero fattura','','text','required')+field('carrier_code','Numero spedizione BRT','','text','required')+field('reference','Riferimento mittente','','text','required')+field('recipient','Destinatario','','text','required')+field('postcode','CAP')+field('shipped_on','Data movimento',state.month+'-01','date','required')+field('transport','Trasporto €','','number','min="0" step="0.0001" required')+field('fuel','Carburante €',0,'number','min="0" step="0.0001" required')+field('extras','Supplementi €',0,'number','min="0" step="0.0001" required'),v=>api('portal_carrier_charges',{method:'POST',body:{...v,month:state.month+'-01',transport:Number(v.transport),fuel:Number(v.fuel),extras:Number(v.extras)}}))}
function normalize(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'').toLowerCase()}
function matchForm(id){const c=state.charges.find(c=>c.id===id);const candidates=state.shipments.filter(s=>s.reference===c.reference);showForm('Abbina addebito BRT','<div class="wide"><p><strong>'+esc(c.recipient)+'</strong> · CAP '+esc(c.postcode)+' · riferimento '+esc(c.reference)+'</p><p class="muted">Controlla destinatario e CAP. Più addebiti possono riferirsi alla stessa spedizione.</p><label for="f_shipment_id">Spedizione</label><select id="f_shipment_id" name="shipment_id"><option value="">Da attribuire</option>'+[...candidates,...state.shipments.filter(s=>!candidates.includes(s))].map(s=>'<option value="'+s.id+'" '+(s.id===c.shipment_id?'selected':'')+'>'+esc((candidates.includes(s)?'Rif. coincidente · ':'')+clientName(s.client_id)+' · '+s.code+' · '+s.recipient+' · '+s.postcode)+'</option>').join('')+'</select></div>',v=>persist('portal_carrier_charges',id,{shipment_id:v.shipment_id||null}))}
function returnForm(id){if(!state.clients.length){toast('Crea prima un cliente');return}const r=state.returns.find(r=>r.id===id)||{};showForm(id?'Modifica reso':'Nuovo reso',clientField(r.client_id)+field('received_on','Data rientro',r.received_on||state.month+'-01','date','required')+field('shipment_code','Numero spedizione',r.shipment_code)+field('reason','Motivo',r.reason)+'<div><label for="f_status">Stato</label><select id="f_status" name="status">'+['Ricevuto','In verifica','Chiuso'].map(s=>'<option '+(s===r.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div>',v=>persist('portal_returns',id,v))}
function accessForm(){if(!state.clients.length)return toast('Crea prima un cliente');showForm('Collega account cliente',clientField()+field('user_id','ID utente Supabase','','text','required pattern="[0-9a-fA-F-]{36}"')+'<p class="muted wide">L’ID si trova in Supabase → Authentication → Users. Il collegamento non crea né invia credenziali.</p>',v=>api('portal_members',{method:'POST',query:'on_conflict=user_id',prefer:'resolution=merge-duplicates,return=representation',body:v}))}
async function showAccess(){try{const rows=await api('portal_members');if($('#accesslist'))$('#accesslist').innerHTML=table(['ID account','Cliente',''],rows.map(r=>[esc(r.user_id),esc(clientName(r.client_id)),'<button class="secondary small" onclick="revokeAccess(\''+r.user_id+'\')">Revoca accesso</button>']))}catch(e){if($('#accesslist'))$('#accesslist').textContent=e.message}}
async function revokeAccess(id){if(!confirm('Revocare l’accesso di questo account al portale clienti?'))return;try{await api('portal_members',{method:'DELETE',query:'user_id=eq.'+id});showAccess();toast('Accesso revocato')}catch(e){toast(e.message)}}
function csvCell(v){let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function downloadCSV(name,rows){const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportData(){let rows;if(state.view==='carriers'&&state.admin)rows=[['Data','Fattura','Codice BRT','Riferimento','Destinatario','Cliente','Spedizione','Trasporto','Carburante','Supplementi','Costo BRT'],...charges().map(c=>{const s=state.shipments.find(s=>s.id===c.shipment_id);return[c.shipped_on,c.invoice_number,c.carrier_code,c.reference,c.recipient,s?clientName(s.client_id):'Da attribuire',s?.code||'',c.transport,c.fuel,c.extras,Number(c.transport)+Number(c.fuel)+Number(c.extras)]})];else if(['shipments','carriers'].includes(state.view))rows=[['Data','Cliente','Spedizione','Ordine','Destinatario','CAP','Città','Corriere','Importo cliente'],...shipments().map(s=>[s.shipped_on,clientName(s.client_id),s.code,s.order_number,s.recipient,s.postcode,s.city,s.carrier,s.customer_charge])];else rows=[['Cliente','Mese','Spedizioni fatturabili','Tariffa logistica','Logistica','m3 fatturabili','Tariffa spazio','Spazio','Resi fatturabili','Tariffa resi','Resi','Stato'],...invoiceLines().map(m=>[m.name,m.month,m.billable_shipments,m.logistics_rate,m.logistics,m.billable_m3,m.storage_rate,m.storage,m.billable_returns,m.return_rate,m.returnfee,m.released?'Confermato':'Bozza'])];downloadCSV('Nexus_'+state.view+'_'+state.month+'.csv',rows)}
const shipmentHeaders=['cliente','numero spedizione','data spedizione','destinatario','cap','citta','numero ordine','riferimento brt','corriere'];
const chargeHeaders=['fattura','codice brt','riferimento mittente','data','destinatario','cap','trasporto','carburante','supplementi','mese fattura'];
function downloadTemplate(kind){downloadCSV('Modello_'+kind+'.csv',[kind==='shipments'?shipmentHeaders:chargeHeaders])}
function parseCSV(text){text=text.replace(/^\ufeff/,'');const line=text.split(/\r?\n/)[0],sep=line.split(';').length>=line.split(',').length?';':',';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('Virgolette non chiuse nel CSV');row.push(cell.trim());if(row.some(Boolean))rows.push(row);return rows}
function isoDate(value){let v=String(value).trim(),m;if(/^\d{4}-\d{2}-\d{2}/.test(v))v=v.slice(0,10);else if((m=v.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})/)))v=m[3]+'-'+m[2]+'-'+m[1];else throw Error('Data non valida: '+value);const d=new Date(v+'T12:00:00Z');if(!Number.isFinite(d.getTime())||d.toISOString().slice(0,10)!==v)throw Error('Data non valida: '+value);return v}
function csvNumber(value){if(value==='')throw Error('Importo mancante');const n=Number(String(value).replace(/€/g,'').trim().replace(',','.'));if(!Number.isFinite(n)||n<0)throw Error('Importo non valido: '+value);return n}
async function importCSV(file,kind){if(!file)return;try{if(file.size>5*1024*1024)throw Error('CSV troppo grande: massimo 5 MB');const rows=parseCSV(await file.text()),headers=rows.shift().map(normalize);if(!rows.length)throw Error('Il file non contiene righe');const get=(row,...names)=>{for(const n of names){const i=headers.indexOf(normalize(n));if(i>=0)return row[i]??''}return ''},items=[],seen=new Set();let skips=0;for(let i=0;i<rows.length;i++){const r=rows[i];try{if(kind==='shipments'){const name=get(r,'cliente','integrazione'),client=state.clients.find(c=>normalize(c.name)===normalize(name));if(!client)throw Error('Cliente sconosciuto: '+name);const code=get(r,'numero spedizione','code');if(!code)throw Error('Numero spedizione mancante');if(seen.has(code)||state.shipments.some(s=>s.code===code)){skips++;continue}seen.add(code);const recipient=get(r,'destinatario','recipient');if(!recipient)throw Error('Destinatario mancante');const ref=get(r,'riferimento brt','riferimento mittente');items.push({client_id:client.id,code,recipient,shipped_on:isoDate(get(r,'data spedizione','data generazione ldv','shipped_on')),reference:ref||null,postcode:get(r,'cap destinatario','cap'),city:get(r,'citta destinatario','citta'),order_number:get(r,'numero ordine','numeroordine'),carrier:get(r,'corriere')||'BRT'})}else{const invoice_number=get(r,'fattura'),carrier_code=get(r,'codice brt'),reference=get(r,'riferimento mittente'),recipient=get(r,'destinatario');if(!invoice_number||!carrier_code||!reference||!recipient)throw Error('Fattura, codice BRT, riferimento o destinatario mancante');const key=invoice_number+'|'+carrier_code;if(seen.has(key)||state.charges.some(c=>c.invoice_number===invoice_number&&c.carrier_code===carrier_code)){skips++;continue}seen.add(key);const monthValue=get(r,'mese fattura');items.push({invoice_number,carrier_code,reference,recipient,postcode:get(r,'cap'),shipped_on:isoDate(get(r,'data')),month:monthValue?isoDate(monthValue.slice(0,7)+'-01'):state.month+'-01',transport:csvNumber(get(r,'trasporto')),fuel:csvNumber(get(r,'carburante')||'0'),extras:csvNumber(get(r,'supplementi')||'0')})}}catch(e){throw Error('Riga '+(i+2)+': '+e.message)}}if(!items.length){toast('Nessuna nuova riga. '+skips+' duplicati esclusi.');return}showForm('Conferma importazione','<div class="wide"><p><strong>'+items.length+' nuove righe</strong> · '+skips+' duplicati esclusi.</p><p class="muted">'+(kind==='shipments'?'Clienti riconosciuti. Le quantità mensili restano da confermare.':'Gli addebiti saranno salvati senza abbinamenti automatici.')+'</p>'+table(['Codice','Destinatario','Data'],items.slice(0,10).map(r=>[esc(r.code||r.carrier_code),esc(r.recipient),date(r.shipped_on)]))+'</div>',()=>api(kind==='shipments'?'portal_shipments':'portal_carrier_charges',{method:'POST',body:items}))}catch(e){toast(e.message)}}
