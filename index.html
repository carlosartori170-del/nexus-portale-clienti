formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:#eef3ef;color:var(--dark);padding:5px 12px}.check{display:flex;align-items:center;gap:10px}.check input{width:auto}.login button[type=submit]{width:100%}.statusline{margin-bottom:16px}.footer{font-size:13px;color:var(--muted);margin-top:24px}#toast{position:fixed;bottom:20px;right:20px;max-width:430px;z-index:100;padding:14px 20px;border-radius:10px;background:var(--dark);color:white;display:none}.split{display:grid;gap:18px}.uploadbox{border:1px dashed #aac4b5;border-radius:10px;padding:22px;background:#fafcfb}code{font-size:14px;background:#edf3ef;padding:2px 5px;border-radius:4px}.loading{padding:50px;text-align:center}.pill{background:#edf3ef;padding:8px 12px;border-radius:8px;font-size:14px}.highlight{background:var(--dark);color:white}.highlight .muted{color:#c0d8ca}@media(max-width:1100px){main{padding:24px}.shell{grid-template-columns:190px 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.topbar{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}.sidebar{padding:16px;gap:12px}.sidebar .brand{font-size:25px}.nav{display:flex;overflow:auto;gap:6px}.nav button{white-space:nowrap;font-size:14px;padding:9px}.sidebottom{display:flex;align-items:center;justify-content:space-between}.sidebottom button{width:auto;margin:0}.sidebar .tag{display:none}main{padding:18px}.filters{width:100%;flex-wrap:wrap}.filters .control{flex:1;min-width:135px}.kpis{gap:10px}.card{padding:17px}.kpi .value{font-size:27px}.pagehead{flex-direction:column}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}h1{font-size:25px}.login{margin:25px 16px;padding:25px}.topbar{margin-bottom:20px}}

<script>
'use strict';
const CONFIG={url:'https://eqtyfnluswalfassmlxd.supabase.co',key:'sb_publishable_QFxWloxs6waJCTvV1jtuPQ_MI7K4foM'};
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null?'Da completare':Number(v).toLocaleString('it-IT',{style:'currency',currency:'EUR'}),num=v=>v==null?'—':Number(v).toLocaleString('it-IT',{maximumFractionDigits:4});
const date=v=>v?String(v).slice(0,10).split('-').reverse().join('/'):'—',monthName=v=>new Date(v+'-02T12:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
let session=null;try{session=JSON.parse(sessionStorage.getItem('nexus_portal_session')||'null')}catch{}
let state={admin:false,clients:[],months:[],shipments:[],charges:[],returns:[],storageDays:[],inbounds:[],sectionValidations:[],workflowError:'',client:'all',month:'2026-09',view:'overview',email:''};
const TABS=[['profile','Scheda cliente'],['overview','Riepilogo'],['billing','Fatturazione'],['history','Storico fatture'],['shipments','Spedizioni'],['storage','Spazio occupato'],['carriers','Corrieri'],['returns','Resi'],['inbounds','Ricevimento merce'],['manage','Clienti e accessi'],['imports','Importazioni']];
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',5000)}
function saveSession(s){session=s;s?sessionStorage.setItem('nexus_portal_session',JSON.stringify(s)):sessionStorage.removeItem('nexus_portal_session')}
async function auth(path,body){const r=await fetch(CONFIG.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:CONFIG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Accesso non riuscito');if(d.access_token&&d.expires_in&&!d.expires_at)d.expires_at=Math.floor(Date.now()/1000)+d.expires_in;return d}
let refreshPromise=null;
async function token(){if(!session)throw Error('Accedi al portale');if(session.expires_at*1000<Date.now()+60000){if(!refreshPromise)refreshPromise=auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token}).then(saveSession).catch(e=>{saveSession(null);login('Sessione scaduta. Accedi nuovamente.');throw e}).finally(()=>refreshPromise=null);await refreshPromise}return session.access_token}
async function api(table,{method='GET',query='',body,prefer='return=representation'}={}){const tok=await token();const r=await fetch(CONFIG.url+'/rest/v1/'+table+(query?'?'+query:''),{method,headers:{apikey:CONFIG.key,Authorization:'Bearer '+tok,'Content-Type':'application/json',Prefer:prefer},body:body===undefined?undefined:JSON.stringify(body)});let d=null;const txt=await r.text();try{d=txt?JSON.parse(txt):null}catch{throw Error('Risposta del server non valida')}if(!r.ok)throw Error(d?.message||'Impossibile completare la richiesta');return d}
async function all(table){let rows=[],offset=0;while(true){const chunk=await api(table,{query:'select=*&order='+ (table==='portal_admins'?'user_id':'id')+'&limit=1000&offset='+offset});rows.push(...chunk);if(chunk.length<1000)break;offset+=1000}return rows}
function login(error=''){ $('#app').innerHTML='<div class="login"><div class="brand">NEX<span>US</span></div><p class="tag">Portale clienti</p><h1 style="margin-top:28px">I tuoi dati, ogni mese.</h1><p class="muted">Spedizioni, logistica, spazio occupato e resi.</p><form id="loginform"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginerror">'+(error?'<div class="error">'+esc(error)+'</div>':'')+'</div><button type="submit">Accedi</button></form><p class="footer">L’accesso viene abilitato da Nexus per la tua azienda.</p></div>';$('#loginform').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const s=await auth('token?grant_type=password',{email:$('#email').value.trim(),password:$('#password').value});s.expires_at=Math.floor(Date.now()/1000)+s.expires_in;saveSession(s);await load()}catch(err){$('#loginerror').innerHTML='<div class="error">'+esc(err.message)+'</div>';b.disabled=false}}}
async function load(){try{const a=await all('portal_admins');state.admin=a.length>0;state.email=session.user?.email||'';[state.clients,state.months,state.shipments,state.returns,state.storageDays,state.inbounds,state.sectionValidations]=await Promise.all(['portal_clients','portal_months','portal_shipments','portal_returns','portal_storage_days','portal_inbounds','portal_section_validations'].map(all));state.charges=state.admin?await all('portal_carrier_charges'):[];[state.invoiceDocuments,state.invoiceIssuer]=await Promise.all([all('portal_invoice_documents'),state.admin?api('portal_invoice_issuer',{query:'id=eq.nexus'}).then(r=>r[0]):Promise.resolve(null)]);if(!state.admin&&state.clients.length)state.client=state.clients[0].id;if(!state.clients.length&&!state.admin){$('#app').innerHTML='<div class="login"><div class="brand">NEXUS</div><h1>Accesso da abilitare</h1><p>Il tuo account non è ancora collegato a un cliente. Contatta Nexus.</p><button onclick="logout()">Esci</button></div>';return}shell()}catch(e){if(session){$('#app').innerHTML='<div class="login"><h1>Dati non disponibili</h1><div class="error">'+esc(e.message)+'</div><button onclick="load()">Riprova</button> <button class="secondary" onclick="logout()">Esci</button></div>'}}}
async function logout(){if(session)try{await fetch(CONFIG.url+'/auth/v1/logout',{method:'POST',headers:{apikey:CONFIG.key,Authorization:'Bearer '+session.access_token}})}catch{}saveSession(null);state.client='all';state.view='overview';login()}
function clientName(id){return state.clients.find(c=>c.id===id)?.name||'Da attribuire'}
function selected(r){return state.client==='all'||r.client_id===state.client}
function inMonth(d){return d?.slice(0,7)===state.month}
function shipments(){return state.shipments.filter(r=>selected(r)&&inMonth(r.shipped_on))}
function returns(){return state.returns.filter(r=>selected(r)&&inMonth(r.received_on))}
function months(){return state.months.filter(r=>selected(r)&&inMonth(r.month))}
function charges(){return state.charges.filter(r=>inMonth(r.month)&&(state.client==='all'||state.shipments.find(s=>s.id===r.shipment_id)?.client_id===state.client))}
function fee(q,r){return q==null||r==null?null:Number(q)*Number(r)}
function sumComplete(items,key){if(!items.length||items.some(r=>r[key]==null))return null;return items.reduce((n,r)=>n+Number(r[key]),0)}
function invoiceLines(){return months().map(m=>{const c=state.clients.find(c=>c.id===m.client_id);return {...m,logistics:m.invoice_lines?sumConfigured(m.invoice_lines.filter(r=>!['billable_m3','billable_returns','carrier_total'].includes(r.basis)),'amount'):fee(m.billable_shipments,m.logistics_rate),storage:m.invoice_lines?sumConfigured(m.invoice_lines.filter(r=>r.basis==='billable_m3'),'amount'):fee(m.billable_m3,m.storage_rate),returnfee:m.invoice_lines?sumConfigured(m.invoice_lines.filter(r=>r.basis==='billable_returns'),'amount'):fee(m.billable_returns,m.return_rate),name:c?.name}})}
function shell(){ $('#app').innerHTML='<div class="shell"><aside class="sidebar"><div><div class="brand">NEX<span>US</span></div><div class="tag">Portale clienti</div></div><nav class="nav">'+TABS.filter(([v])=>state.admin||!['manage','imports'].includes(v)).map(([v,t])=>'<button data-tab="'+v+'" class="'+(state.view===v?'active':'')+'">'+t+'</button>').join('')+'</nav><div class="sidebottom"><div>'+esc(state.admin?'Amministratore Nexus':'Area cliente')+'<br><span style="color:#b5cabe">'+esc(state.email)+'</span></div><button onclick="logout()">Esci</button></div></aside><main><header class="topbar"><div><div class="tag">Attività e fatturazione</div><strong>'+esc(state.client==='all'?'Tutti i clienti':clientName(state.client))+'</strong></div><div class="filters">'+(state.admin?'<div class="control"><label for="clientfilter">Cliente</label><select id="clientfilter"><option value="all">Tutti i clienti</option>'+state.clients.map(c=>'<option value="'+c.id+'" '+(state.client===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>':'')+'<div class="control"><label for="monthfilter">Mese</label><input id="monthfilter" type="month" value="'+state.month+'" required></div><button class="secondary" onclick="load()">Aggiorna</button></div></header><div id="content"></div><div class="footer">Importi in euro. IVA e totale sono indicati nei riepiloghi. I documenti PDF salvati sono consultabili nello Storico fatture.</div></main></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.view=b.dataset.tab;shell()});if($('#clientfilter'))$('#clientfilter').onchange=e=>{state.client=e.target.value;shell()};$('#monthfilter').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){state.month=e.target.value;shell()}};render()}
function head(title,desc,actions=''){return '<div class="pagehead"><div><h1>'+title+'</h1><p class="muted">'+desc+'</p></div><div class="actions">'+actions+'</div></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+ (rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+headers.length+'" class="empty">Nessun dato per questo periodo.</td></tr>')+'</tbody></table></div>'}
function badge(m){return m.released?'<span class="badge">Confermato</span>':'<span class="badge amber">Bozza</span>'}
function render(){const view=state.view;let html='';if(view==='overview'){const ms=invoiceLines(),ss=shipments(),cs=charges(),drafts=ms.filter(m=>!m.released).length;html=head('Riepilogo mensile',monthName(state.month),'<button class="secondary" onclick="exportData()">Esporta CSV</button>'+(state.admin?'<button onclick="monthlyForm()">Apri fatturazione</button>':''));html+='<div class="kpis">'+[['Spedizioni registrate',ss.length,'Da estrazione Deagor'],['Metri cubi fatturabili',num(sumComplete(ms,'billable_m3')),'Quantità confermata nel riepilogo'],['Corrieri al cliente',money(sumComplete(ss,'customer_charge')),'Importi da fatturare'],['Resi registrati',returns().length,'Movimenti di rientro']].map(([l,v,h])=>'<div class="card kpi"><div class="label">'+l+'</div><div class="value">'+v+'</div><div class="muted" style="font-size:14px">'+h+'</div></div>').join('')+'</div>';
if(state.admin&&drafts)html+='<div class="notice">'+drafts+' riepiloghi in bozza. Le quantità estratte vanno controllate prima di confermare la fatturazione.</div>';
html+='<div class="grid"><section class="card"><h2>Voci per la fatturazione</h2>'+table(['Cliente','Logistica e altri servizi','Spazio','Resi','Stato'],ms.map(m=>[esc(m.name),money(m.logistics),money(m.storage),money(m.returnfee),badge(m)]))+'<p class="footer">Il dettaglio sottostante riporta tutte le voci configurate, gli importi fissi e i servizi inclusi. Corrieri indicati separatamente.</p></section><section class="card highlight"><h2>'+ (state.admin?'Controllo corrieri':'Il tuo riepilogo')+'</h2>'+ (state.admin?'<div class="row"><span>Costo BRT del periodo</span><strong>'+money(cs.reduce((n,r)=>n+Number(r.transport)+Number(r.fuel)+Number(r.extras),0))+'</strong></div><div class="row"><span>Addebiti abbinati</span><strong>'+cs.filter(r=>r.shipment_id).length+' / '+cs.length+'</strong></div><div class="row"><span>Da attribuire</span><strong>'+cs.filter(r=>!r.shipment_id).length+'</strong></div><p class="muted">Il costo del corriere è visibile solo a Nexus.</p><button class="secondary" onclick="state.view=\'carriers\';shell()">Controlla abbinamenti</button>':'<p class="muted">'+(ms.length?'I riepiloghi confermati sono riportati a fianco.':'Nexus non ha ancora confermato il riepilogo del mese.')+'</p>')+'</section></div>';}
if(view==='shipments'){html=head('Spedizioni e logistica','Dettaglio degli ordini spediti nel mese.', '<button class="secondary" onclick="exportData()">Esporta CSV</button>'+(state.admin?'<button onclick="shipmentForm()">Nuova spedizione</button>':''))+table(['Data','Cliente','Spedizione / ordine','Destinatario','CAP / città','Corriere','Addebito cliente',...(state.admin?['']:[])],shipments().sort((a,b)=>b.shipped_on.localeCompare(a.shipped_on)).map(s=>[date(s.shipped_on),esc(clientName(s.client_id)),esc(s.code)+'<br><span class="muted">'+esc(s.order_number||'')+'</span>',esc(s.recipient),esc(s.postcode)+' '+esc(s.city),esc(s.carrier),money(s.customer_charge),...(state.admin?['<button class="secondary small" onclick="shipmentForm(\''+s.id+'\')">Modifica</button>']:[])]));}
if(view==='storage'){html=storagePage();}
if(view==='carriers'){html=head('Corrieri',state.admin?'Costi BRT, abbinamenti e importi da fatturare al cliente.':'Importi dei trasporti da fatturare.', '<button class="secondary" onclick="exportData()">Esporta CSV</button>'+(state.admin?'<button onclick="chargeForm()">Nuovo addebito</button>':''));if(state.admin){html+='<div class="notice">Gli abbinamenti iniziali sono stati verificati sui due PDF. Per i nuovi addebiti il riferimento BRT viene proposto insieme a destinatario e CAP: l’associazione va confermata.</div>'+table(['Data','Fattura / codice BRT','Rif. mittente','Destinatario','Trasporto','Carburante','Supplementi','Costo totale','Cliente / spedizione',''],charges().map(c=>{const s=state.shipments.find(s=>s.id===c.shipment_id);return [date(c.shipped_on),esc(c.invoice_number)+'<br>'+esc(c.carrier_code),esc(c.reference),esc(c.recipient),num(c.transport)+' €',num(c.fuel)+' €',num(c.extras)+' €',num(Number(c.transport)+Number(c.fuel)+Number(c.extras))+' €',s?esc(clientName(s.client_id))+'<br>'+esc(s.code):'<span class="badge amber">Da attribuire</span>','<button class="secondary small" onclick="matchForm(\''+c.id+'\')">'+(s?'Modifica abbinamento':'Abbina')+'</button>']}));html+='<h2 style="margin-top:30px">Importi al cliente</h2>'}html+=table(['Cliente','Spedizione','Destinatario','Addebito al cliente',...(state.admin?['']:[])],shipments().map(s=>[esc(clientName(s.client_id)),esc(s.code),esc(s.recipient),money(s.customer_charge),...(state.admin?['<button class="secondary small" onclick="shipmentForm(\''+s.id+'\')">Imposta importo</button>']:[])]));}

function deagorUpload(){deagorSelectedFiles=[];const d=$('#dialog');d.innerHTML='<div class="dialoghead"><h2>Importa file Deagor</h2><button class="close" onclick="document.querySelector(\'#dialog\').close()">×</button></div><p>Seleziona insieme inventari CSV/PDF, ordini CSV/PDF e ricevimenti CSV. I PDF di ricevimento vuoti vengono segnalati e non generano quantità.</p><div><label>Cliente per inventari PDF e ricevimenti senza integrazione</label><select id="deagorclient"><option value="">Seleziona cliente</option>'+options(state.client)+'</select></div><p class="muted">Per selezionare più file insieme tieni premuto Ctrl mentre clicchi sui file, oppure Shift per un intervallo. Puoi anche scegliere un file e aggiungerne altri riaprendo il selettore.</p><label for="deagorfiles" style="margin-top:18px">Aggiungi file (puoi selezionarne più di uno)</label><input id="deagorfiles" type="file" accept=".csv,.pdf" multiple><div id="deagorselected" style="margin-top:12px">Nessun file selezionato.</div><div id="deagorprogress"></div><button id="deagorread" style="margin-top:18px">Leggi i file</button><p class="muted">Le date inventario proposte dal nome del file vanno confermate. Il costo corriere Deagor non viene inserito automaticamente nell’addebito al cliente.</p>';d.showModal();$('#deagorfiles').onchange=e=>{for(const f of e.target.files){if(!deagorSelectedFiles.some(p=>p.name===f.name&&p.size===f.size&&p.lastModified===f.lastModified))deagorSelectedFiles.push(f)}e.target.value='';$('#deagorselected').innerHTML='<strong>'+deagorSelectedFiles.length+' file selezionati</strong><ul>'+deagorSelectedFiles.map(f=>'<li>'+esc(f.name)+'</li>').join('')+'</ul>'};$('#deagorread').onclick=()=>readDeagorFiles(deagorSelectedFiles,$('#deagorclient').value)}
async function readDeagorFiles(files,cid){if(!files.length)return toast('Seleziona almeno un file');const b=$('#deagorread');b.disabled=true;const result={orders:[],inbounds:[],snapshots:[],warnings:[]};try{if(files.length>100)throw Error('Massimo 100 file alla volta');for(let n=0;n<files.length;n++){const file=files[n];$('#deagorprogress').textContent='Lettura '+(n+1)+' / '+files.length+' · '+file.name;if(file.size>15*1024*1024)throw Error('File troppo grande: '+file.name);try{let kind=/^inventory_/i.test(file.name)?'inventory':/^order_/i.test(file.name)?'orders':/^inbound_/i.test(file.name)?'inbounds':'';let pages,records;if(/\.pdf$/i.test(file.name)){pages=await readDeagorPDF(file);if(!pages.some(p=>p.length)){result.warnings.push(file.name+': PDF privo di testo. Nessun movimento importato; nessuno zero assegnato.');continue}if(!kind){const text=pages.flat().map(i=>i.str).join(' ');kind=/total_qty/.test(text)&&/\bsku\b/.test(text)?'inventory':/Numero Spedizione Deagor/.test(text)?'orders':''}if(kind==='inventory'){const g=inventoryPDFText(pdfTextLines(pages));result.snapshots.push({...g,client_id:cid,observed_on:filenameInventoryDate(file.name),date_source:filenameInventoryDate(file.name)?'filename_epoch':'manual',source_name:file.name});continue}if(kind==='inbounds')throw Error('Per un PDF di ricevimento con dati serve verificare il tracciato. Usa il modello CSV ricevimenti.');records=pdfOrderRows(pages)}else if(/\.csv$/i.test(file.name)){const text=await file.text();records=csvRecords(text);if(!kind){const keys=Object.keys(records[0]||{});kind=keys.includes(normalize('sku'))&&keys.includes(normalize('total_qty'))?'inventory':keys.includes(normalize('Numero Spedizione Deagor'))?'orders':keys.includes(normalize('Data Ricevimento'))?'inbounds':''}if(kind==='inventory'){for(const g of inventoryCSV(text))result.snapshots.push({...g,observed_on:filenameInventoryDate(file.name),date_source:filenameInventoryDate(file.name)?'filename_epoch':'manual',source_name:file.name});continue}}else throw Error('Formato non supportato');if(kind==='orders')result.orders.push(...records.map(r=>deagorOrder(r,file.name)));else if(kind==='inbounds')result.inbounds.push(...records.map(r=>deagorInbound(r,file.name,cid)));else throw Error('Tipo di file non riconosciuto')}catch(e){result.warnings.push(file.name+': '+e.message)}}deagorPreview(result)}catch(e){$('#deagorprogress').innerHTML='<div class="error">'+esc(e.message)+'</div>';b.disabled=false}}
function uniqueMovements(rows,key){const seen=new Map();for(const r of rows){const k=key(r);if(seen.has(k)){const previous={...seen.get(k)},current={...r};delete previous.source_name;delete current.source_name;if(JSON.stringify(previous)!==JSON.stringify(current))throw Error('Dati discordanti nei file per '+k)}else seen.set(k,r)}return [...seen.values()]}
function deagorPreview(result){try{result.orders=uniqueMovements(result.orders,r=>r.code);result.inbounds=uniqueMovements(result.inbounds,r=>r.client_id+'|'+r.code)}catch(e){toast(e.message);return}const newOrders=result.orders.filter(r=>!state.shipments.some(s=>s.code===r.code)).length;const fields='<div class="wide"><p><strong>'+result.orders.length+' spedizioni</strong> ('+newOrders+' nuove, '+(result.orders.length-newOrders)+' già presenti: verranno completate) · <strong>'+result.inbounds.length+' ricevimenti</strong> · <strong>'+result.snapshots.length+' inventari</strong>.</p><p class="muted">I pezzi sono il “Totale Qty” Deagor e possono comprendere accessori e materiali di confezionamento. Gli importi corriere al cliente e gli abbinamenti BRT già presenti vengono conservati.</p>'+result.warnings.map(w=>'<div class="notice">'+esc(w)+'</div>').join('')+table(['Cliente','Ordine / spedizione','Data uscita','Pezzi','Data etichetta'],result.orders.map(r=>[esc(clientName(r.client_id)),esc(r.order_number)+' / '+esc(r.code),date(r.shipped_on),num(r.shipped_pieces),date(r.label_created_on)]))+ (result.inbounds.length?'<h2 style="margin-top:20px">Ricevimenti</h2>'+table(['Cliente','Codice','Data','Pezzi'],result.inbounds.map(r=>[esc(clientName(r.client_id)),esc(r.code),date(r.received_on),num(r.total_pieces)])):'')+result.snapshots.map((s,i)=>'<section class="card" style="margin-top:16px"><strong>'+esc(s.source_name)+'</strong><div class="formgrid"><div><label>Cliente inventario</label><select name="client_'+i+'" required><option value="">Seleziona</option>'+options(s.client_id)+'</select></div>'+field('date_'+i,'Data inventario',s.observed_on,'date','required')+'</div><p>'+num(s.total_units)+' pezzi · '+num(s.volume_m3)+' m³ · '+s.sku_count+' SKU</p>'+(s.zero_volume_skus?'<p class="notice">'+s.zero_volume_skus+' SKU con pezzi presenti e volume zero.</p>':'')+'</section>').join('')+'</div>'+(result.snapshots.length?'<label class="check wide"><input type="checkbox" name="replace">Sostituisci inventari già presenti per lo stesso cliente e giorno</label>':'')+(result.snapshots.some(s=>s.zero_volume_skus)?'<label class="check wide"><input type="checkbox" name="accept_zero" required>Ho verificato le segnalazioni sul volume zero degli inventari.</label>':'')+(!result.orders.length&&!result.inbounds.length&&!result.snapshots.length?'<p class="wide">Nessun dato importabile nei file selezionati.</p>':'');showForm('Anteprima importazione Deagor',fields,async v=>{if(!result.orders.length&&!result.inbounds.length&&!result.snapshots.length)throw Error('Nessun dato da salvare.');const seen=new Set(),snapshots=[];let skipped=0;for(let i=0;i<result.snapshots.length;i++){const s=result.snapshots[i],client_id=v['client_'+i],observed_on=isoDate(v['date_'+i]),key=client_id+'|'+observed_on;if(!client_id)throw Error('Seleziona il cliente di ogni inventario');if(seen.has(key))throw Error('Due inventari per lo stesso cliente e giorno: '+date(observed_on));seen.add(key);if(v.replace!=='on'&&state.storageDays.some(d=>d.client_id===client_id&&d.observed_on===observed_on)){skipped++;continue}snapshots.push({...s,client_id,observed_on,date_source:observed_on===s.observed_on?s.date_source:'manual'})}await api('rpc/portal_import_deagor_batch',{method:'POST',body:{p_orders:result.orders,p_inbounds:result.inbounds,p_snapshots:snapshots,p_replace:v.replace==='on'}});if(skipped)toast(skipped+' inventari già presenti esclusi.');})}
function monthlyDeagorQuantities(cid){const ss=state.shipments.filter(s=>s.client_id===cid&&inMonth(s.shipped_on)),labels=state.shipments.filter(s=>s.client_id===cid&&s.label_created_on&&inMonth(s.label_created_on)),ins=state.inbounds.filter(s=>s.client_id===cid&&inMonth(s.received_on)),lastDay=state.month+'-'+String(new Date(Number(state.month.slice(0,4)),Number(state.month.slice(5)),0).getDate()).padStart(2,'0'),stock=state.storageDays.find(d=>d.client_id===cid&&d.observed_on===lastDay);return {billable_shipments:ss.length?new Set(ss.map(s=>s.order_number?.trim()||s.code)).size:null,shipped_pieces:ss.length&&ss.every(s=>s.shipped_pieces!=null)?ss.reduce((n,s)=>n+Number(s.shipped_pieces),0):null,received_pieces:ins.length?ins.reduce((n,s)=>n+Number(s.total_pieces),0):null,stock_pieces:stock?.total_units??null,created_shipments:labels.length?labels.length:null}}

const RATE_CATEGORIES={logistics:'Servizi logistici (nel minimo)',packaging:'Materiali d’imballaggio (fuori minimo)',extra:'Lavorazioni extra (fuori minimo)',carriers:'Corrieri (fuori minimo)'};
const SECTIONS={shipments:'Spedizioni',inbounds:'Ricevimento',returns:'Resi',carriers:'Corrieri',storage:'Spazio occupato'};
function sectionValidation(cid,section){return state.sectionValidations.find(v=>v.client_id===cid&&v.month.slice(0,7)===state.month&&v.section===section)}
function sectionSummary(section,p){if(section==='shipments')return num(p.billable_shipments)+' ordini · '+num(p.shipped_pieces)+' pezzi · '+num(p.created_shipments)+' spedizioni create';if(section==='inbounds')return num(p.received_pieces)+' pezzi ricevuti';if(section==='returns')return num(p.billable_returns)+' resi chiusi · '+num(p.pending_returns)+' ancora aperti';if(section==='carriers')return money(p.carrier_total)+' al cliente · '+num(p.missing_charges)+' importi mancanti · '+num(p.unmatched_shipments)+' senza fattura abbinata';return num(p.billable_m3)+' m³ · '+p.days+' / '+p.expected_days+' giorni nel periodo · stock '+num(p.stock_pieces)+' pezzi al '+date(p.stock_date)}
async function validateSection(cid,section,period){try{const previous=sectionValidation(cid,section)?.payload,args={p_client:cid,p_month:state.month+'-01',p_section:section};if(section==='storage'){args.p_start=period?.start||previous?.period_start||state.month+'-01';args.p_end=period?.end||previous?.period_end||state.month+'-'+new Date(Number(state.month.slice(0,4)),Number(state.month.slice(5)),0).getDate()}const p=await api('rpc/portal_section_snapshot',{method:'POST',body:args});const fields='<div class="wide"><h2>'+esc(clientName(cid))+'</h2><p>'+esc(monthName(state.month))+'</p><p><strong>'+esc(sectionSummary(section,p))+'</strong></p></div>'+(section==='storage'?field('period_start','Inizio attività / periodo',args.p_start,'date','required min="'+state.month+'-01" max="'+args.p_end+'"')+field('period_end','Fine periodo',args.p_end,'date','required')+'<div class="wide"><button type="button" class="secondary" onclick="reloadStoragePeriod(\''+cid+'\')">Ricalcola anteprima del periodo</button><p class="muted">Media dei soli giorni presenti nel periodo. I giorni mancanti non vengono conteggiati come zero. Lo stock è l’ultimo inventario disponibile nel periodo.</p></div><label class="check wide"><input name="ack_partial" type="checkbox" '+(p.partial?'required':'')+'>Convalido la media sui giorni presenti e il periodo indicato, anche se il mese è incompleto.</label>':'')+(p.rows===0?'<label class="check wide"><input name="ack_empty" type="checkbox" required>Ho verificato che non vi è attività per questa sezione nel periodo: confermo quantità zero.</label>':'')+((section==='storage'&&p.zero_volume_skus>0)||(section==='returns'&&p.pending_returns>0)||(section==='carriers'&&p.unmatched_shipments>0)?'<label class="check wide"><input name="ack_issues" type="checkbox" required>'+ (section==='storage'?'Ho verificato gli articoli con quantità positiva e volume zero.':section==='returns'?'I resi ancora aperti sono esclusi dai resi gestiti da fatturare.':'Ho verificato le spedizioni prive di fattura corriere abbinata; confermo gli importi al cliente.')+'</label>':'')+'<label class="check wide"><input name="checked" type="checkbox" required>Ho controllato i dati e convalido questa sezione per la prefatturazione.</label>';showForm('Convalida '+SECTIONS[section],fields,async v=>{if(section==='storage'&&(v.period_start!==args.p_start||v.period_end!==args.p_end))throw Error('Ricalcola l’anteprima dopo aver modificato il periodo.');const response=await api('rpc/portal_validate_section',{method:'POST',body:{...args,p_ack_partial:v.ack_partial==='on',p_ack_empty:v.ack_empty==='on',p_ack_issues:v.ack_issues==='on'}});state.workflowError=response.preinvoice_error||''});$('#editform button[type="submit"]').textContent='Convalida sezione'}catch(e){toast(e.message)}}
function reloadStoragePeriod(cid){const start=$('#f_period_start').value,end=$('#f_period_end').value;$('#dialog').close();validateSection(cid,'storage',{start,end})}
function billingPage(){const clients=state.clients.filter(c=>state.client==='all'||c.id===state.client);let html=head('Fatturazione',state.admin?'Convalida le cinque sezioni: le quantità passano automaticamente in prefatturazione. Poi conferma il riepilogo finale.':'Riepiloghi confermati da Nexus.', '<button class="secondary" onclick="exportData()">Esporta CSV</button>');if(state.workflowError&&state.admin)html+='<div class="notice">'+esc(state.workflowError)+'. Correggi le tariffe e aggiorna la prefattura.</div>';for(const c of clients){const m=state.months.find(r=>r.client_id===c.id&&inMonth(r.month)),validations=Object.keys(SECTIONS).map(k=>sectionValidation(c.id,k)),allValid=validations.every(Boolean);html+='<section class="card" style="margin-bottom:22px"><div class="pagehead"><h2>'+esc(c.name)+' · '+esc(monthName(state.month))+'</h2>'+(m?badge(m):'<span class="badge amber">Da preparare</span>')+'</div>';if(state.admin)html+=table(['Sezione','Dati convalidati','Stato',''],Object.entries(SECTIONS).map(([k,l])=>{const v=sectionValidation(c.id,k);return[l,v?esc(sectionSummary(k,v.payload)):'Dati da controllare',v?'<span class="badge">Convalidata</span>':'<span class="badge amber">Da convalidare</span>','<button class="secondary small" onclick="validateSection(\''+c.id+'\',\''+k+'\')">'+(v?'Riconvalida':'Controlla e convalida')+'</button>']}))+'<div class="actions" style="margin-top:18px"><button class="secondary" '+(!allValid?'disabled':'')+' onclick="buildInvoice(\''+c.id+'\')">Aggiorna prefattura</button><button class="secondary" '+(!allValid?'disabled':'')+' onclick="buildInvoice(\''+c.id+'\',false,true)">Usa tariffe attuali</button><button '+(!allValid||!m?.workflow_managed||m?.released?'disabled':'')+' onclick="confirmInvoice(\''+c.id+'\')">Conferma finale</button></div>';
 if(m){if(state.admin&&!m.released&&(Number(m.minimum_logistics||0)!==Number(c.minimum_logistics||0)||m.vat_rate!==c.vat_rate))html+='<div class="notice">Minimo o IVA del cliente sono cambiati. Premi Aggiorna prefattura per applicarli prima della conferma.</div>';if(state.admin&&!allValid&&m.workflow_managed)html+='<div class="notice">Una o più sezioni sono cambiate: il dettaglio seguente va aggiornato dopo la nuova convalida.</div>';if(!m.workflow_managed&&state.admin)html+='<p class="muted">Riepilogo precedente: convalida le sezioni per passare al nuovo flusso automatico.</p>';const lines=monthlyLines(m);html+='<h2 style="margin-top:24px">'+(m.released?'Riepilogo confermato':'Prefatturazione')+'</h2>'+table(['Voce','Categoria','Quantità fatturata','Multipli di','Tariffa','Importo','Condizioni'],lines.map(r=>[esc(r.label),esc(RATE_CATEGORIES[r.category||(r.basis==='carrier_total'?'carriers':'logistics')]),num(r.quantity),num(r.multiple||1),r.mode==='included'?'Incluso':money(r.rate),money(r.amount),esc(r.note)]))+invoiceBreakdown(m)+invoiceTaxSummary(m);if(m.storage_scope)html+='<p class="muted">Spazio: periodo '+date(m.storage_scope.period_start)+' – '+date(m.storage_scope.period_end)+'; media di '+m.storage_scope.days+' rilevazioni'+(m.storage_scope.partial?' con copertura parziale convalidata':'')+'. Stock dell’ultimo inventario disponibile: '+date(m.storage_scope.stock_date)+'.</p>'}else html+='<p class="muted">La prefattura viene generata quando tutte le sezioni sono convalidate.</p>';html+='</section>'}return html}
async function buildInvoice(cid,confirm=false,refresh=false){try{await api('rpc/portal_build_preinvoice',{method:'POST',body:{p_client:cid,p_month:state.month+'-01',p_confirm:confirm,p_refresh_rates:refresh}});state.workflowError='';await load();toast(confirm?'Fatturazione confermata':'Prefattura aggiornata senza reinserire le quantità')}catch(e){state.workflowError=e.message;render();toast(e.message)}}

function applyBRTCosts(cid){const shipments=state.shipments.filter(s=>s.client_id===cid&&inMonth(s.shipped_on)),rows=shipments.filter(s=>s.customer_charge==null).map(s=>{const costs=state.charges.filter(c=>c.shipment_id===s.id);return {shipment:s,cost:costs.length?Math.round(costs.reduce((n,c)=>n+Number(c.transport)+Number(c.fuel)+Number(c.extras),0)*100)/100:null}}).filter(r=>r.cost!=null);if(!rows.length)return toast('Nessun costo BRT abbinato da proporre agli importi mancanti');showForm('Proposta importi corriere al cliente','<div class="wide"><p>Questa operazione applica ai soli importi mancanti il costo BRT delle righe abbinate, senza maggiorazioni. Conferma se queste sono le condizioni concordate con il cliente.</p>'+table(['Spedizione','Importo proposto'],rows.map(r=>[esc(r.shipment.code),money(r.cost)]))+'</div><label class="check wide"><input name="checked" type="checkbox" required>Confermo questi importi da addebitare al cliente.</label>',async()=>{await api('rpc/portal_apply_brt_costs',{method:'POST',body:{p_client:cid,p_month:state.month+'-01',p_quotes:rows.map(r=>({shipment_id:r.shipment.id,cost:r.cost}))}})})}

o'}

async function openInvoicePDF(id){try{const d=state.invoiceDocuments.find(d=>d.id===id),s=await storageRequest('object/sign/client-invoices/'+d.object_path,'POST',{expiresIn:600}),signed=s.signedURL||s.signedUrl;if(!signed)throw Error('PDF non disponibile');const url=new URL(signed.startsWith('/object/')?'/storage/v1'+signed:signed,CONFIG.url+'/storage/v1/');if(url.origin!==new URL(CONFIG.url).origin)throw Error('Indirizzo documento non valido');const r=await fetch(url.href);if(!r.ok)throw Error('Impossibile scaricare il PDF archiviato');showPDFViewer(await r.blob(),'Fattura '+d.invoice_number,pdfFilename(d.snapshot))}catch(e){toast(e.message)}}
async function pdfLibrary(){if(globalThis.PDFLib)return globalThis.PDFLib;if(!pdfLibraryPromise)pdfLibraryPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';script.crossOrigin='anonymous';script.integrity='sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI';script.onload=()=>{if(globalThis.PDFLib)resolve(globalThis.PDFLib);else{pdfLibraryPromise=null;script.remove();reject(Error('Generatore PDF non disponibile'))}};script.onerror=()=>{pdfLibraryPromise=null;script.remove();reject(Error('Impossibile caricare il generatore PDF. Riprova.'))};document.head.append(script)});return pdfLibraryPromise}

async function createInvoicePDF(s,preview=false){const {PDFDocument,StandardFonts,rgb}=await pdfLibrary(),doc=await PDFDocument.create(),assets=await letterheadAssets(),headerImage=await doc.embedJpg(assets.header),footerImage=await doc.embedPng(assets.footer),regular=await doc.embedFont(StandardFonts.Helvetica),bold=await doc.embedFont(StandardFonts.HelveticaBold),green=rgb(.025,.48,.28),ink=rgb(.07,.2,.16),muted=rgb(.38,.45,.42),line=rgb(.85,.9,.87),light=rgb(.94,.97,.95);const W=595.28,H=841.89,L=42,R=553;let page,y;

newPage();const top=y;text('FORNITORE',L,y,9,bold,green);text('CLIENTE',310,y,9,bold,green);let bottoms=[];for(const [p,x,width] of [[s.issuer,L,238],[s.customer,310,243]]){let py=top-17;partyLines(p).forEach((t,i)=>{for(const row of wrap(t,width,9,i===0?bold:regular)){text(row,x,py,9,i===0?bold:regular);py-=12}});bottoms.push(py)}y=Math.min(...bottoms)-14;
